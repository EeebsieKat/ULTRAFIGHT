  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'light-purple': '#f0e6ff',
            'light-blue': '#e6f0ff',
            'light-orange': '#fff5e6',
            'light-green': '#e6fff0',
            'soft-grey': '#e0e0e0',
            'dark-grey': '#333333',
          },
        }
      }
    }
  </script>

  <style>
/* -------------------- Custom/Helper Styles for Layout -------------------- */
@import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap');

body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
}

/* -------------------- SWITCH/TOGGLE STYLING (Custom for Tailwind's Lack of direct slider styling) -------------------- */
.switch {
  /* Position absolute relative to its new parent: <header> */
  position: absolute; 
  top: 10px;
  right: 10px;
  display: inline-block;
  width: 44px;
  height: 22px;
  z-index: 100;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #333; 
  transition: 0.4s;
  border-radius: 11px;
}
.slider:before {
  position: absolute;
  content: "";
  height: 16px; 
  width: 16px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: 0.4s;
  border-radius: 50%;
}
input:checked + .slider {
  background-color: #4CAF50; 
}
input:checked + .slider:before {
  transform: translateX(22px);
}
</style>
</head>
<body class="bg-soft-grey m-0 text-dark-grey font-['Helvetica_Neue']">

<header class="flex items-center justify-center pt-4 pb-2 relative z-50">
    
    <button id="showLeaderboardBtn" class="absolute top-4 left-4 p-1.5 px-3 text-sm font-bold text-white bg-dark-grey rounded-md shadow-md hover:bg-gray-700 active:translate-y-px transition-all" style="display:none;">
        View Leaderboard
    </button>

    <h1 class="text-4xl font-extrabold text-dark-grey shadow-none">ULTRAFIGHT</h1>

    <label class="switch">
      <input type="checkbox" id="musicToggle" checked>
      <span class="slider round"></span>
    </label>
</header>

<section id="startup" class="max-w-lg mx-auto mt-6 p-4 rounded-lg bg-white border border-gray-300 shadow-lg transition-all duration-600 ease-out animate-in fade-in zoom-in-98">
  <label for="playerNameInput" class="block font-bold text-lg">Enter player name:</label>
  <input id="playerNameInput" type="text" placeholder="Player name..." maxlength="20" autocomplete="off" class="w-full p-2.5 text-lg mt-1 bg-gray-50 text-dark-grey border border-gray-300 rounded-md outline-none focus:border-dark-grey focus:ring-1 focus:ring-dark-grey transition-all" />
  <button id="addPlayerBtn" class="block mt-2 p-2.5 w-full text-xl font-bold text-white bg-dark-grey border-none rounded-md shadow-md hover:bg-gray-600 active:translate-y-px transition-all">Add Player</button>
  <ul id="playerListDisplay" class="mt-3 list-disc list-inside space-y-1 text-lg"></ul>

<label for="file-upload" class="custom-file-upload mt-3 inline-block px-3 py-1.5 text-base font-bold text-white bg-gray-600 border-none rounded-md cursor-pointer shadow-md hover:bg-gray-700 transition-all">
  Upload Deck JSON 
</label>
<input id="file-upload" type="file" accept=".json,application/json" class="hidden" />
<div id="deckStatus" class="text-base text-gray-600 mt-1">...</div>


  <label class="block mt-3 text-lg"><input type="checkbox" id="useLocationsCheckbox" checked class="mr-1" /> Use Locations Deck</label>
  <label class="block text-lg"><input type="checkbox" id="useScenariosCheckbox" checked class="mr-1" /> Use Scenarios Deck</label>
  <button id="startBtn" class="mt-4 p-3 w-full text-xl font-extrabold text-white bg-dark-grey border-none rounded-lg shadow-xl hover:bg-gray-700 active:translate-y-px transition-all">Start Game</button>
</section>

<section id="gameplay" class="max-w-[98%] w-[98%] mx-auto mt-2 p-4 rounded-lg bg-white border border-gray-300 shadow-lg overflow-x-auto" style="display:none;">
    
    <div id="game-table-container" class="flex justify-center gap-2">
        
        <div id="location-card-area" class="flex justify-center items-start flex-shrink-0 p-2"> 
            </div>

        <div id="center-cards-area" class="flex flex-col flex-grow min-w-0">
            <div id="player-name-row" class="flex w-full text-center font-bold text-lg mb-1 flex-wrap">
                </div>
            <div id="cards-row" class="flex w-full items-start flex-wrap justify-center">
                </div>
        </div>
        
        <div id="scenario-card-area" class="flex justify-center items-start flex-shrink-0 p-2">
            </div>
    </div>
    <button id="gmWinBtn" class="mt-2 p-2.5 w-full text-lg font-bold text-white bg-gray-500 border-none rounded-md shadow-md hover:bg-gray-600 active:translate-y-px transition-all">Declare Winner</button>
</section>

<section id="leaderboard-screen" class="fixed inset-0 bg-soft-grey flex flex-col items-center justify-center p-4 transition-opacity duration-300 ease-in-out z-40" style="display:none;">
    <div class="max-w-xl w-full p-6 rounded-lg bg-white border-4 border-dark-grey shadow-2xl">
        <h2 class="text-3xl font-extrabold text-center text-dark-grey mb-4">Leaderboard</h2>
        <div id="leaderboard" class="p-3 bg-gray-50 rounded-lg border border-gray-200 max-h-96 overflow-y-auto">
            <ul id="leaderboardList" class="list-none space-y-2 text-xl font-semibold">
                </ul>
        </div>
    </div>
</section>

<section id="win-screen" class="hidden">
    <div class="max-w-md mx-auto mt-12 p-8 text-center rounded-lg bg-white border-4 border-dark-grey shadow-2xl">
        <h2 class="text-3xl font-extrabold text-dark-grey">ULTIMATE CHAMPION</h2>
        <h3 id="finalWinnerName" class="text-5xl text-dark-grey font-bold my-2">WINNER</h3>
        <p class="text-lg text-gray-600">Has won the ULTRAVERSE tournament!</p>
        <button id="playAgainBtn" class="mt-6 p-3 w-full text-xl font-extrabold text-white bg-dark-grey border-none rounded-lg shadow-xl hover:bg-gray-700 active:translate-y-px transition-all">Play Again (New Game)</button>
    </div>
</section>

<audio id="dealSound" src="Sounds/card_deal.mp3" preload="auto"></audio>
<audio id="bgMusic" src="Sounds/rockbg.mp3" loop preload="auto"></audio>

// NOTE: These are now effectively unused/redundant, as the logic relies on the 'decks' object below
let CHARACTERS = [];
let WEAPONS = [];
let TWISTS = [];
let LOCATIONS = [];
let SCENARIOS = [];


const playerNameInput = document.getElementById('playerNameInput');
const addPlayerBtn = document.getElementById('addPlayerBtn');
const playerListDisplay = document.getElementById('playerListDisplay');
const useLocationsCheckbox = document.getElementById('useLocationsCheckbox');
const useScenariosCheckbox = document.getElementById('useScenariosCheckbox');
const startBtn = document.getElementById('startBtn');
const gameplaySection = document.getElementById('gameplay');
const startupSection = document.getElementById('startup');
const deckStatus = document.getElementById("deckStatus");

const locationCardArea = document.getElementById('location-card-area');
const scenarioCardArea = document.getElementById('scenario-card-area');

const gmWinBtn = document.getElementById('gmWinBtn');
const leaderboardList = document.getElementById('leaderboardList');
const dealSound = document.getElementById('dealSound');
const winScreenSection = document.getElementById('win-screen');
const finalWinnerNameDisplay = document.getElementById('finalWinnerName');

const MAX_SCORE_THRESHOLD = 5;

const cardsRow = document.getElementById('cards-row');

// Music Toggle
const musicToggle = document.getElementById("musicToggle");
musicToggle.addEventListener("change", () => {
  if (musicToggle.checked) {
    bgMusic.play().catch(() => {});
  } else {
    bgMusic.pause();
  }
});


let localPlayers = [];
let useLocations = true;
let useScenarios = true;
let currentFight = null;

function renderPlayerList() {
  playerListDisplay.innerHTML = '';
  localPlayers.forEach((name, index) => {
    const li = document.createElement('li');
    li.textContent = name;
    li.setAttribute('draggable', true);
    li.dataset.index = index;
    li.className = 'py-0.5 px-1 text-lg border-b border-gray-200 cursor-move'; 
    li.ondragstart = e => {
      e.dataTransfer.setData('text/plain', index);
      li.classList.add('opacity-50');
    };
    li.ondragend = () => li.classList.remove('opacity-50');
    li.ondragover = e => {
      e.preventDefault();
      li.classList.add('bg-gray-100');
    };
    li.ondragleave = () => li.classList.remove('bg-gray-100');
    li.ondrop = e => {
      e.preventDefault();
      li.classList.remove('bg-gray-100');
      const from = parseInt(e.dataTransfer.getData('text/plain'));
      const to = parseInt(li.dataset.index);
      const moved = localPlayers.splice(from, 1)[0];
      localPlayers.splice(to, 0, moved);
      renderPlayerList();
    };
    playerListDisplay.appendChild(li);
  });
}

addPlayerBtn.onclick = () => {
  const name = playerNameInput.value.trim();
  if (!name || localPlayers.includes(name)) return;
  localPlayers.push(name);
  playerNameInput.value = '';
  renderPlayerList();
};

// Initialize decks directly with the embedded data
const decks = {
  characters: embeddedDeckData.characters,
  weapons: embeddedDeckData.weapons,
  twists: embeddedDeckData.twists,
  locations: embeddedDeckData.locations,
  scenarios: embeddedDeckData.scenarios
};

// --- START: Manual Deck Loading via File Upload (Kept for override/fallback) ---
const deckUpload = document.getElementById("file-upload");
deckUpload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) {
    console.log("❌ No file selected.");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const json = JSON.parse(reader.result);
      if (!json.characters || !json.weapons || !json.twists || !json.locations || !json.scenarios) {
        throw new Error("Missing required fields in JSON");
      }

      // Overwrite the embedded decks
      decks.characters = json.characters;
      decks.weapons = json.weapons;
      decks.twists = json.twists;
      decks.locations = json.locations;
      decks.scenarios = json.scenarios;

      deckStatus.textContent = "✅ Custom deck uploaded and loaded!";
      deckStatus.style.color = "#4CAF50";
    } catch (err) {
      console.error("❌ Deck import error:", err.message);
      deckStatus.textContent = "⚠️ Invalid JSON or missing fields.";
      deckStatus.style.color = "#f44336";
    }
  };

  reader.onerror = () => {
    console.error("❌ FileReader error:", reader.error);
    deckStatus.textContent = "⚠️ File could not be read.";
    deckStatus.style.color = "#f44336";
  };

  reader.readAsText(file);
});

function pickRandom(arr) {
  if (arr.length === 0) return { name: "Deck Empty!", desc: "Draw Error" };
  return arr[Math.floor(Math.random() * arr.length)];
}

/**
 * Picks a random item from an array and removes it (Draw without replacement).
 * @param {Array} arr - The array to draw from. This array is mutated.
 * @returns {*} The drawn item or null if the array is empty.
 */
function drawRandom(arr) {
  // If the array is empty, return an error object
  if (arr.length === 0) return { name: "Deck Empty!", desc: "Deck Empty" }; 
  const randomIndex = Math.floor(Math.random() * arr.length);
  const [item] = arr.splice(randomIndex, 1);
  return item;
}


function pickCardsForFight() {
  const chars = decks.characters;
  const weaps = decks.weapons;
  const twsts = decks.twists;
  const locs = decks.locations;
  const scns = decks.scenarios;

  if (chars.length === 0 || weaps.length === 0 || twsts.length === 0) {
    // If essential decks are empty, stop and alert
    alert("One or more essential decks (Character, Weapon, Twist) are empty. Please ensure a deck is loaded.");
    // Force back to startup screen
    startupSection.style.display = 'block';
    gameplaySection.style.display = 'none';
    showLeaderboardBtn.style.display = 'none';
    throw new Error("Game cannot start with empty decks.");
  }


  // Create mutable copies of the decks for unique card drawing
  const availableChars = [...chars];
  const availableWeaps = [...weaps];
  const availableTwsts = [...twsts];
  
  if (localPlayers.length > Math.min(chars.length, weaps.length, twsts.length)) {
    console.warn("Not enough unique cards for all players. Some cards may repeat or be empty.");
  }


  return {
    players: localPlayers.map(p => ({
      name: p,
      character: drawRandom(availableChars),
      weapon: drawRandom(availableWeaps),
      twist: drawRandom(availableTwsts)
    })),
    // Use the main deck object for random pick (not drawing with replacement)
    location: useLocations ? pickRandom(locs) : null,
    scenario: useScenarios ? pickRandom(scns) : null
  };
}


function playDealSound() {
  dealSound.currentTime = 0;
  dealSound.play().catch(() => {});
}

// Function: Handles card click to select a winner
function handleCardClick(event) {
  // Clear previous selection
  document.querySelectorAll('.card').forEach(c => {
    // Revert non-selected cards to original state
    c.classList.remove('border-[3px]', 'border-dark-grey', 'bg-yellow-100', 'shadow-2xl');
    c.classList.add('bg-white', 'shadow-md');
  });

  // Highlight the clicked card
  const clickedCard = event.currentTarget;
  const winnerName = clickedCard.dataset.playerName;

  clickedCard.classList.remove('bg-white', 'shadow-md');
  clickedCard.classList.add('border-[3px]', 'border-dark-grey', 'bg-yellow-100', 'shadow-2xl');

  // Store the winner's name
  selectedWinnerName = winnerName;
}

/**
 * Creates the single card cell for one player with fixed dimensions.
 * @param {Object} player - Player data with character, weapon, and twist.
 * @returns {HTMLElement} The card cell containing the single card.
 */
function createCardCell(player) {
    // Player card dimensions
    const cardWidth = '260px'; 
    const cardHeight = '390px'; 
    const cellWidth = '290px'; 
    
    const cell = document.createElement('div');
    // Set cell to a fixed size and ensure it wraps
    cell.className = 'p-2 flex justify-center flex-shrink-0'; 
    cell.style.width = cellWidth;
    
    // Create the single card element
    const card = document.createElement('div');
    card.style.width = cardWidth;
    card.style.height = cardHeight;
    // Single card styling
    card.className = `card border border-gray-400 rounded-xl p-4 text-center cursor-pointer shadow-md flex flex-col justify-between items-center bg-white opacity-0 transition-opacity duration-500 ease-in-out transition-all duration-300`;
    
    card.dataset.playerName = player.name; 
    
    // Construct the card content HTML with player name only in the header
    card.innerHTML = `
        <div class="text-2xl font-bold w-full mb-3 pb-3 border-b-4 border-gray-300 text-dark-grey">
            ${player.name}
        </div>
        <div class="flex flex-col flex-grow justify-around w-full">
            <div class="my-3">
                <p class="font-bold text-lg mb-1 text-dark-grey">CHARACTER</p>
                <p class="text-base font-semibold px-2 py-1 rounded-lg border-2 border-purple-900 text-dark-grey">${player.character.name}</p>
            </div>
            
            <div class="my-3">
                <p class="font-bold text-lg mb-1 text-dark-grey">WEAPON</p>
                <p class="text-base font-semibold px-2 py-1 rounded-lg border-2 border-yellow-600 text-dark-grey">${player.weapon.name}</p>
            </div>

            <div class="my-3">
                <p class="font-bold text-lg mb-1 text-dark-grey">TWIST</p>
                <p class="text-base font-semibold px-2 py-1 rounded-lg border-2 border-blue-600 text-dark-grey">${player.twist.name}</p>
            </div>
        </div>
    `;

    card.onclick = handleCardClick; 
    cell.appendChild(card);
    return cell;
}

/**
 * Creates a context card (Location or Scenario) with a similar style but smaller size.
 * @param {Object} cardData - Data for the card (name, desc).
 * @param {string} type - 'location' or 'scenario'.
 * @returns {HTMLElement} The card element.
 */
function createContextCard(cardData, type) {
    const cardWidth = '200px'; 
    const cardHeight = '300px'; 
    
    const card = document.createElement('div');
    card.style.width = cardWidth;
    card.style.height = cardHeight;

    const baseColor = type === 'location' ? 'bg-light-orange' : 'bg-light-green';
    const borderColor = type === 'location' ? 'border-orange-500' : 'border-green-500';

    card.className = `card border border-gray-400 rounded-xl p-3 text-center shadow-md flex flex-col justify-between items-center ${baseColor} opacity-0 transition-opacity duration-500 ease-in-out transition-all duration-300`;
    
    // Construct the card content HTML
    card.innerHTML = `
        <div class="text-xl font-bold w-full mb-2 pb-2 border-b-2 ${borderColor} text-dark-grey uppercase">
            ${type}
        </div>
        <div class="flex flex-col flex-grow justify-center w-full">
            <p class="text-lg font-bold text-dark-grey mb-1">${cardData.name}</p>
            ${cardData.desc ? `<p class="text-sm text-gray-700 mt-2">${cardData.desc}</p>` : ''}
        </div>
    `;
    return card;
}


// Function to handle the dealing and rendering
function dealAndRender() {
    try {
        currentFight = pickCardsForFight();
    } catch (e) {
        // If pickCardsForFight throws an error (due to empty deck), stop.
        console.error(e);
        return;
    }

    const f = currentFight;
    selectedWinnerName = null;

    // Clear all previous content (names, cards, context)
    playerNameRow.innerHTML = ''; 
    cardsRow.innerHTML = '';
    locationCardArea.innerHTML = ''; 
    scenarioCardArea.innerHTML = ''; 

    playerNameRow.classList.add('flex-wrap');
    cardsRow.classList.add('flex-wrap', 'justify-center'); // Ensure cards are centered


    // 2. DEAL CARDS (Single Card, Sequential per Player)
    let maxDelay = 0;

    f.players.forEach((p, playerIndex) => {
        const cardCell = createCardCell(p);
        cardsRow.appendChild(cardCell);

        const cardElement = cardCell.querySelector('.card');
        if (!cardElement) return;

        // Deal delay: Player Index * 300ms
        const dealDelay = playerIndex * 300;
        maxDelay = Math.max(maxDelay, dealDelay);

        setTimeout(() => {
            playDealSound();
            cardElement.classList.remove('opacity-0'); // Fade in the card
        }, dealDelay);
    });

    
    // 3. DEAL LOCATION AND SCENARIO (Context Cards)
    setTimeout(() => {
        // Location Card (Left Side)
        if (f.location && f.location.name !== "Deck Empty!") {
            const locationCard = createContextCard(f.location, 'location');
            locationCardArea.appendChild(locationCard);
            
            playDealSound();
            // Start fade in
            setTimeout(() => locationCard.classList.remove('opacity-0'), 50);
        }

        // Scenario Card (Right Side)
        if (f.scenario && f.scenario.name !== "Deck Empty!") {
            const scenarioCard = createContextCard(f.scenario, 'scenario');
            scenarioCardArea.appendChild(scenarioCard);

            playDealSound();
            // Start fade in
            setTimeout(() => scenarioCard.classList.remove('opacity-0'), 300);
        }
    }, maxDelay + 500); // Start context cards after the main cards are done
}

function renderFight() {
  dealAndRender();
}


function updateLeaderboard(winner) {
  leaderboard[winner] = (leaderboard[winner] || 0) + 1;

  if (leaderboard[winner] >= MAX_SCORE_THRESHOLD) {
    // WIN CONDITION MET - SHOW WIN SCREEN
    finalWinnerNameDisplay.textContent = winner;
    gameplaySection.style.display = 'none';
    leaderboardScreen.style.display = 'none'; // Hide leaderboard if it was open
    showLeaderboardBtn.style.display = 'none'; // Hide leaderboard button
    winScreenSection.classList.remove('hidden');
    
    return;
  }
}

function renderLeaderboard() {
  leaderboardList.innerHTML = '';
  Object.entries(leaderboard)
    .sort((a, b) => b[1] - a[1])
    .forEach(([name, score]) => {
      const li = document.createElement('li');
      // Updated class to look cleaner on the leaderboard screen
      li.className = 'text-lg py-1 border-b border-gray-200 flex justify-between items-center';
      li.innerHTML = `<span>${name}</span> <span class="font-bold text-xl">${score} win${score !== 1 ? 's' : ''}</span>`;
      leaderboardList.appendChild(li);
    });
}

// LEADERBOARD TOGGLE LOGIC - CONSOLIDATED
showLeaderboardBtn.onclick = () => {
    if (leaderboardScreen.style.display === 'flex') {
        // Currently showing leaderboard, so close it
        leaderboardScreen.style.display = 'none';
        gameplaySection.style.display = 'block';
        showLeaderboardBtn.textContent = 'View Leaderboard';
    } else {
        // Currently showing game, so open leaderboard
        leaderboardScreen.style.display = 'flex'; 
        gameplaySection.style.display = 'none';
        renderLeaderboard(); // Always render before showing
        // UPDATED TEXT HERE
        showLeaderboardBtn.textContent = 'Hide Leaderboard';
    }
};

// Play Again button handler
playAgainBtn.onclick = () => {
    leaderboard = {};
    renderLeaderboard();
    selectedWinnerName = null;
    winScreenSection.classList.add('hidden');
    showLeaderboardBtn.style.display = 'none'; // Ensure button is hidden on returning to startup
    startupSection.style.display = 'block';
    
    // Re-set deck status after playing again
    deckStatus.textContent = "✅ Deck embedded directly in script!";
    deckStatus.style.color = "#4CAF50";
};


gmWinBtn.onclick = () => {
  const winner = selectedWinnerName; 
  if (!winner) return alert('Please click any card for a player to select the winner.'); 
  
  updateLeaderboard(winner);
  
  // Only deal a new hand if the game hasn't ended
  if(gameplaySection.style.display !== 'none') {
    selectedWinnerName = null; 
    dealAndRender();
  }
};

startBtn.onclick = () => {
  if (localPlayers.length < 2) return alert('Add at least two players to begin.');

  if (decks.characters.length === 0 || decks.weapons.length === 0 || decks.twists.length === 0) {
      return alert('Deck data is missing. Please upload a deck manually.');
  }

  useLocations = useLocationsCheckbox.checked;
  useScenarios = useScenariosCheckbox.checked;
  
  startupSection.style.display = 'none';
  gameplaySection.style.display = 'block';
  leaderboardScreen.style.display = 'none'; 
  showLeaderboardBtn.style.display = 'block'; 
  showLeaderboardBtn.textContent = 'View Leaderboard'; // Set initial text
  
  leaderboard = {}; 
  renderFight();

  // 🔊 Play background music
  bgMusic.volume = 0.1; 
  if (musicToggle.checked) {
      bgMusic.play().catch(() => {
        console.warn("Autoplay blocked; user interaction needed");
      });
  }
};

bgMusic.addEventListener("canplaythrough", () => {
  musicToggle.parentElement.style.display = "inline-block";
});

window.onload = () => {
  renderPlayerList();
  // Update status to confirm embedded deck load
  deckStatus.textContent = "✅ Deck embedded directly in script!";
  deckStatus.style.color = "#4CAF50";
};

#startup, #gameplay, #win-screen > div {

@keyframes fadeInBounce {

  60% {

button {

@keyframes buttonPulse {

button:hover:not(:disabled) {

.card {

  flex: 0 0 280px;

  border-radius: 12px;
  padding: 0.75rem; 
  color: #eee;

  transform-style: preserve-3d;
  opacity: 0;
  animation: flipBounce 1s ease forwards;
  margin: 0.5rem;
  text-align: center; 
  /* Retained: Increased general card text size */
  font-size: 1.15rem; 
}

/* Style for the Player Name (h3) */
.card h3 {

.card.winner-selected {

@keyframes flipBounce {

#gameplay {

.switch {
  position: absolute;
  top: 10px;
  right: 10px;
  display: inline-block;
  width: 60px;
  height: 34px;
  z-index: 100;
}

/* Hide default HTML checkbox */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* The slider */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: 0.4s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: 0.4s;
  border-radius: 50%;
}

/* Toggle On */
input:checked + .slider {
  background-color: #66bb6a;
}

input:checked + .slider:before {
  transform: translateX(26px);
}

</style>

const playerNameInput = document.getElementById('playerNameInput');
const addPlayerBtn = document.getElementById('addPlayerBtn');
const playerListDisplay = document.getElementById('playerListDisplay');

const useScenariosCheckbox = document.getElementById('useScenariosCheckbox');
const startBtn = document.getElementById('startBtn');
const gameplaySection = document.getElementById('gameplay');
const startupSection = document.getElementById('startup');
const fightContextDiv = document.getElementById('fight-context');

let leaderboard = {}; // reset every game session

// Global variable to store the name of the clicked winner

// Music Toggle
const musicToggle = document.getElementById("musicToggle");
musicToggle.addEventListener("change", () => {
  if (musicToggle.checked) {
    bgMusic.play().catch(() => {});
  } else {
    bgMusic.pause();
  }

let localPlayers = [];
let useLocations = true;
let useScenarios = true;
let currentFight = null;

function renderPlayerList() {
  playerListDisplay.innerHTML = '';
  localPlayers.forEach((name, index) => {
    const li = document.createElement('li');
    li.textContent = name;
    li.setAttribute('draggable', true);
    li.dataset.index = index;
    li.ondragstart = e => {
      e.dataTransfer.setData('text/plain', index);
      li.classList.add('dragging');
    };
    li.ondragend = () => li.classList.remove('dragging');
    li.ondragover = e => {
      e.preventDefault();
      li.classList.add('drag-over');
    };
    li.ondragleave = () => li.classList.remove('drag-over');
    li.ondrop = e => {
      e.preventDefault();
      const from = parseInt(e.dataTransfer.getData('text/plain'));
      const to = parseInt(li.dataset.index);
      const moved = localPlayers.splice(from, 1)[0];
      localPlayers.splice(to, 0, moved);
      renderPlayerList();
    };
    playerListDisplay.appendChild(li);
  });
}

addPlayerBtn.onclick = () => {
  const name = playerNameInput.value.trim();
  if (!name || localPlayers.includes(name)) return;
  localPlayers.push(name);
  playerNameInput.value = '';
  renderPlayerList();
};

const decks = {
  characters: [],
  weapons: [],
  twists: [],
  locations: [],
  scenarios: []
};

const deckUpload = document.getElementById("file-upload");

deckUpload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) {
    console.log("❌ No file selected.");
    return;
  }

  console.log("📁 File selected:", file.name);

  const reader = new FileReader();

  reader.onload = () => {
    console.log("📖 Raw file content:", reader.result);

    try {
      const json = JSON.parse(reader.result);
      console.log("✅ Parsed JSON:", json);

      if (!json.characters || !json.weapons || !json.twists || !json.locations || !json.scenarios) {
        throw new Error("Missing required fields in JSON");
      }

      decks.characters = json.characters;
      decks.weapons = json.weapons;
      decks.twists = json.twists;
      decks.locations = json.locations;
      decks.scenarios = json.scenarios;

      console.log("✅ Decks updated:", decks);

      document.getElementById("deckStatus").textContent = "✅ Custom deck loaded!";
      document.getElementById("deckStatus").style.color = "#33cc33";
    } catch (err) {
      console.error("❌ Deck import error:", err.message);
      document.getElementById("deckStatus").textContent = "⚠️ Invalid JSON or missing fields.";
      document.getElementById("deckStatus").style.color = "#ff4444";
    }
  };

  reader.onerror = () => {
    console.error("❌ FileReader error:", reader.error);
    document.getElementById("deckStatus").textContent = "⚠️ File could not be read.";
    document.getElementById("deckStatus").style.color = "#ff4444";
  };

  reader.readAsText(file);

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

/**
 * Picks a random item from an array and removes it (Draw without replacement).
 * @param {Array} arr - The array to draw from. This array is mutated.
 * @returns {*} The drawn item or null if the array is empty.
 */
function drawRandom(arr) {
  if (arr.length === 0) return { name: "Not enough cards!", desc: "Error" }; // Return an error card if deck is empty
  const randomIndex = Math.floor(Math.random() * arr.length);
  const [item] = arr.splice(randomIndex, 1);
  return item;
}


function pickCardsForFight() {
  const chars = decks.characters.length ? decks.characters : CHARACTERS;
  const weaps = decks.weapons.length ? decks.weapons : WEAPONS;
  const twsts = decks.twists.length ? decks.twists : TWISTS;
  const locs = decks.locations.length ? decks.locations : LOCATIONS;
  const scns = decks.scenarios.length ? decks.scenarios : SCENARIOS;

  // Create mutable copies of the decks for unique card drawing
  const availableChars = [...chars];
  const availableWeaps = [...weaps];
  const availableTwsts = [...twsts];
  
  // Note: For a proper game, you should check localPlayers.length against deck lengths
  // and handle the error if there aren't enough unique cards.

  return {
    players: localPlayers.map(p => ({
      name: p,
      // Use drawRandom on the mutable copies to ensure unique cards
      character: drawRandom(availableChars),
      weapon: drawRandom(availableWeaps),
      twist: drawRandom(availableTwsts)
    })),
    // Location and Scenario are single, shared cards, so they use the standard pickRandom
    location: useLocations ? pickRandom(locs) : null,
    scenario: useScenarios ? pickRandom(scns) : null
  };
}


function playDealSound() {

// Function: Handles card click to select a winner
function handleCardClick(event) {
  // Clear previous selection
  document.querySelectorAll('.card').forEach(c => {
    c.classList.remove('winner-selected');
  });

  // Highlight the clicked card
  const clickedCard = event.currentTarget;
  clickedCard.classList.add('winner-selected');

  // Store the winner's name from the h3 element
  selectedWinnerName = clickedCard.querySelector('h3').textContent.trim();
}


function dealAndRender() {
  // Generate a NEW fight every time this is called
  currentFight = pickCardsForFight();
  const f = currentFight;

  // Reset the winner selection
  selectedWinnerName = null;

  // Update fight context
  fightContextDiv.innerHTML = `
    ${f.location ? `<div style="margin-bottom: 0;"><strong>Location:</strong> ${f.location.name}<br/><em style="color:#aaa;">${f.location.desc || 'No description provided.'}</em></div>` : ''}
    ${f.scenario ? `<div><strong>Scenario:</strong> ${f.scenario.name}</div>` : ''}
  `;

  // Clear and deal new cards
  cardsRow.innerHTML = '';
  f.players.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = `${i * 300}ms`;
    card.onclick = handleCardClick; // Attach the new click handler
    
    // EDITED HERE: Inserted "with a..." and "but..." with styling for emphasis.
    card.innerHTML = `<h3>${p.name}</h3>
      ${p.character.name}<br/>
      <span style="font-style: italic; color: #ff66ff;">with a...</span><br/>
      ${p.weapon.name}<br/>
      <span style="font-style: italic; color: #ff66ff;">but...</span><br/>
      ${p.twist.name}`;
    cardsRow.appendChild(card);
    setTimeout(playDealSound, i * 300);
  });
}

function renderFight() {
  // Set the deal button handler to call the new dealAndRender function
  dealBtn.onclick = dealAndRender;
  dealBtn.disabled = false;
  
  // Call it once to deal the first hand when the game starts
  dealAndRender();
}


function updateLeaderboard(winner) {
  leaderboard[winner] = (leaderboard[winner] || 0) + 1;

  if (leaderboard[winner] >= MAX_SCORE_THRESHOLD) {
    // WIN CONDITION MET - SHOW WIN SCREEN
    finalWinnerNameDisplay.textContent = winner;
    gameplaySection.style.display = 'none';
    winScreenSection.style.display = 'block';
    
    // Do not render the leaderboard again, as the game is over
    return;
  }

  renderLeaderboard();
}

function renderLeaderboard() {
  leaderboardList.innerHTML = '';
  Object.entries(leaderboard)
    .sort((a, b) => b[1] - a[1])
    .forEach(([name, score]) => {
      const li = document.createElement('li');
      li.textContent = `${name}: ${score} win${score !== 1 ? 's' : ''}`;
      leaderboardList.appendChild(li);
    });
}

// NEW FUNCTION: Play Again button handler
playAgainBtn.onclick = () => {
    // Reset state and return to startup screen
    leaderboard = {};
    renderLeaderboard();
    selectedWinnerName = null;
    winScreenSection.style.display = 'none';
    startupSection.style.display = 'block';
};


gmWinBtn.onclick = () => {
  const winner = selectedWinnerName; // Use the stored name from the clicked card
  if (!winner) return alert('Please click a player card to select the winner.'); // Update alert message
  
  updateLeaderboard(winner);
  
  // Only deal a new hand if the game hasn't ended
  if(gameplaySection.style.display !== 'none') {
    selectedWinnerName = null; // Clear selection after use
    dealAndRender();
    renderLeaderboard();
  }
};

startBtn.onclick = () => {
  if (localPlayers.length < 2) return alert('Add at least two players to begin.');
  useLocations = useLocationsCheckbox.checked;
  useScenarios = useScenariosCheckbox.checked;
  
  // Initial fight is now dealt inside renderFight/dealAndRender
  startupSection.style.display = 'none';
  gameplaySection.style.display = 'block';
  renderFight();
  
  leaderboard = {}; // reset leaderboard at game start
  renderLeaderboard();

  // 🔊 Play background music
  bgMusic.volume = 0.1; // optional: adjust volume
  bgMusic.play().catch(() => {
    console.warn("Autoplay blocked; user interaction needed");
  });
};

bgMusic.addEventListener("canplaythrough", () => {
  musicToggle.style.display = "block";
});

window.onload = renderPlayerList;
</script>
</body>
</html>
